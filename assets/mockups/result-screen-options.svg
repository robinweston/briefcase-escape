<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1350" viewBox="0 0 1440 1350">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07101d" flood-opacity=".75"/></filter>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#07101d" flood-opacity=".8"/></filter>
    <pattern id="dots-red" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#7d1e2a" opacity=".55"/></pattern>
    <pattern id="dots-green" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#0c5c51" opacity=".5"/></pattern>
    <linearGradient id="caught-vignette" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#25101a" stop-opacity=".48"/><stop offset="1" stop-color="#080d17" stop-opacity=".94"/></linearGradient>
    <linearGradient id="win-vignette" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#072823" stop-opacity=".38"/><stop offset="1" stop-color="#080d17" stop-opacity=".94"/></linearGradient>
    <clipPath id="a1"><rect x="40" y="98" width="660" height="371" rx="18"/></clipPath>
    <clipPath id="a2"><rect x="740" y="98" width="660" height="371" rx="18"/></clipPath>
    <clipPath id="b1"><rect x="40" y="526" width="660" height="371" rx="18"/></clipPath>
    <clipPath id="b2"><rect x="740" y="526" width="660" height="371" rx="18"/></clipPath>
    <clipPath id="c1"><rect x="40" y="954" width="660" height="371" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="740" y="954" width="660" height="371" rx="18"/></clipPath>
    <style>
      .ui{font-family:'Arial Narrow','Oswald',sans-serif;font-weight:900;letter-spacing:2px}
      .mono{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:1px}
      .outline{paint-order:stroke fill;stroke:#13131a;stroke-width:12;stroke-linejoin:round}
      .thin-outline{paint-order:stroke fill;stroke:#13131a;stroke-width:6;stroke-linejoin:round}
      .option{font:700 22px 'IBM Plex Mono',monospace;fill:#9facbd;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1440" height="1350" fill="#101722"/>
  <text x="40" y="48" class="ui" font-size="30" fill="#f7b62d">RESULT SCREEN DIRECTIONS</text>
  <text x="40" y="79" class="mono" font-size="16" fill="#aab7c8">Each treatment appears only after the worker surprise animation finishes.</text>
  <text x="40" y="121" class="option">OPTION A · BRUSH-SMASH TITLE CARD</text>
  <text x="740" y="121" class="option">CAUGHT / SUCCESS PAIR</text>

  <!-- Option A: large title treatment inspired by the title banner -->
  <g clip-path="url(#a1)">
    <image href="../../baseline-level.png" x="40" y="98" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="40" y="98" width="660" height="371" fill="url(#caught-vignette)"/>
    <path d="M86 216L649 177 614 328 72 349 110 290 64 259Z" fill="#160f14" opacity=".95" filter="url(#shadow)"/>
    <path d="M82 211L635 181 608 309 95 329 120 283 72 255Z" fill="#d74635"/>
    <path d="M95 226L619 195M110 310L590 291" stroke="#f79a38" stroke-width="8" opacity=".65"/>
    <text x="355" y="291" text-anchor="middle" class="ui outline" font-size="104" fill="#fff1c7" transform="rotate(-3 355 291)">CAUGHT!</text>
    <rect x="178" y="383" width="384" height="55" rx="12" fill="#101722" stroke="#f7b62d" stroke-width="3"/>
    <text x="370" y="418" text-anchor="middle" class="mono" font-size="18" fill="#fff7e6">PRESS START TO RETRY</text>
  </g>
  <rect x="40" y="98" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>

  <g clip-path="url(#a2)">
    <image href="../../baseline-level.png" x="740" y="98" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="740" y="98" width="660" height="371" fill="url(#win-vignette)"/>
    <path d="M786 216L1349 177 1314 328 772 349 810 290 764 259Z" fill="#160f14" opacity=".95" filter="url(#shadow)"/>
    <path d="M782 211L1335 181 1308 309 795 329 820 283 772 255Z" fill="#1fad83"/>
    <path d="M795 226L1319 195M810 310L1290 291" stroke="#6ee7bd" stroke-width="8" opacity=".55"/>
    <text x="1055" y="291" text-anchor="middle" class="ui outline" font-size="94" fill="#fff1c7" transform="rotate(-3 1055 291)">ESCAPED!</text>
    <rect x="878" y="383" width="384" height="55" rx="12" fill="#101722" stroke="#f7b62d" stroke-width="3"/>
    <text x="1070" y="418" text-anchor="middle" class="mono" font-size="18" fill="#fff7e6">PRESS START: NEXT LEVEL</text>
  </g>
  <rect x="740" y="98" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>

  <text x="40" y="549" class="option">OPTION B · COMIC FREEZE-FRAME</text>
  <text x="740" y="549" class="option">CHARACTER REACTION + SPEECH BURST</text>

  <!-- Option B: action freezes and character art takes over one side -->
  <g clip-path="url(#b1)">
    <image href="../../baseline-level.png" x="40" y="526" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="40" y="526" width="660" height="371" fill="#260a14" opacity=".78"/>
    <rect x="40" y="526" width="660" height="371" fill="url(#dots-red)"/>
    <path d="M420 541L443 584 491 554 495 604 550 589 535 641 592 644 561 687 612 710 563 738 594 781 538 786 550 838 495 822 489 874 444 843 417 888 391 842 344 873 341 821 286 836 301 784 245 779 277 737 228 708 279 685 248 641 304 639 290 587 345 603 350 553 396 583Z" fill="#fff0bf" stroke="#17131b" stroke-width="8" filter="url(#shadow)"/>
    <text x="420" y="688" text-anchor="middle" class="ui thin-outline" font-size="70" fill="#d84438" transform="rotate(-5 420 688)">CAUGHT!</text>
    <text x="420" y="731" text-anchor="middle" class="mono" font-size="18" fill="#17131b">Nice try, briefcase.</text>
    <image href="../office_workers/generated/c-manager-front.svg" x="65" y="576" width="230" height="288"/>
    <rect x="330" y="810" width="280" height="50" rx="25" fill="#101722" stroke="#fff0bf" stroke-width="3"/>
    <text x="470" y="842" text-anchor="middle" class="mono" font-size="16" fill="#fff">PRESS START TO RETRY</text>
  </g>
  <rect x="40" y="526" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>

  <g clip-path="url(#b2)">
    <image href="../../baseline-level.png" x="740" y="526" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="740" y="526" width="660" height="371" fill="#063027" opacity=".78"/>
    <rect x="740" y="526" width="660" height="371" fill="url(#dots-green)"/>
    <path d="M1120 541L1143 584 1191 554 1195 604 1250 589 1235 641 1292 644 1261 687 1312 710 1263 738 1294 781 1238 786 1250 838 1195 822 1189 874 1144 843 1117 888 1091 842 1044 873 1041 821 986 836 1001 784 945 779 977 737 928 708 979 685 948 641 1004 639 990 587 1045 603 1050 553 1096 583Z" fill="#fff0bf" stroke="#17131b" stroke-width="8" filter="url(#shadow)"/>
    <text x="1120" y="680" text-anchor="middle" class="ui thin-outline" font-size="64" fill="#13a77a" transform="rotate(-5 1120 680)">YOU MADE IT!</text>
    <text x="1120" y="725" text-anchor="middle" class="mono" font-size="18" fill="#17131b">Another floor awaits.</text>
    <image href="../briefcase.svg" x="763" y="624" width="260" height="195"/>
    <rect x="1030" y="810" width="280" height="50" rx="25" fill="#101722" stroke="#fff0bf" stroke-width="3"/>
    <text x="1170" y="842" text-anchor="middle" class="mono" font-size="16" fill="#fff">PRESS START: NEXT LEVEL</text>
  </g>
  <rect x="740" y="526" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>

  <text x="40" y="977" class="option">OPTION C · OFFICE CASE-FILE STAMP</text>
  <text x="740" y="977" class="option">CLEANEST / MOST GAME-UI FRIENDLY</text>

  <!-- Option C: compact case-file card leaves more of the level visible -->
  <g clip-path="url(#c1)">
    <image href="../../baseline-level.png" x="40" y="954" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="40" y="954" width="660" height="371" fill="#08101c" opacity=".7"/>
    <g transform="translate(175 1015) rotate(-2 195 125)" filter="url(#shadow)">
      <rect width="390" height="250" rx="8" fill="#f5e6be" stroke="#1f242d" stroke-width="7"/>
      <path d="M28 54H362M28 187H362" stroke="#b8a984" stroke-width="3"/>
      <text x="28" y="36" class="mono" font-size="14" fill="#565044">ESCAPE REPORT · FLOOR 01</text>
      <rect x="40" y="70" width="310" height="92" rx="5" fill="none" stroke="#bd2f35" stroke-width="9"/>
      <text x="195" y="137" text-anchor="middle" class="ui" font-size="68" fill="#bd2f35">CAUGHT</text>
      <text x="195" y="220" text-anchor="middle" class="mono" font-size="17" fill="#24262d">PRESS START TO RETRY</text>
    </g>
  </g>
  <rect x="40" y="954" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>

  <g clip-path="url(#c2)">
    <image href="../../baseline-level.png" x="740" y="954" width="660" height="371" preserveAspectRatio="xMidYMid slice"/>
    <rect x="740" y="954" width="660" height="371" fill="#08101c" opacity=".62"/>
    <g transform="translate(875 1015) rotate(2 195 125)" filter="url(#shadow)">
      <rect width="390" height="250" rx="8" fill="#f5e6be" stroke="#1f242d" stroke-width="7"/>
      <path d="M28 54H362M28 187H362" stroke="#b8a984" stroke-width="3"/>
      <text x="28" y="36" class="mono" font-size="14" fill="#565044">ESCAPE REPORT · FLOOR 01</text>
      <rect x="40" y="70" width="310" height="92" rx="5" fill="none" stroke="#168568" stroke-width="9"/>
      <text x="195" y="137" text-anchor="middle" class="ui" font-size="64" fill="#168568">CLEARED</text>
      <text x="195" y="220" text-anchor="middle" class="mono" font-size="17" fill="#24262d">PRESS START: NEXT LEVEL</text>
    </g>
  </g>
  <rect x="740" y="954" width="660" height="371" rx="18" fill="none" stroke="#344154" stroke-width="3"/>
</svg>
